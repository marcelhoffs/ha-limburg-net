[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiolimburgnet"
version = "0.1.0"
description = "Async Python client for the public Limburg.net waste collection calendar API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["limburg.net", "waste", "recycling", "home-assistant", "belgium"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aioresponses>=0.7",
]

[project.urls]
Homepage = "https://github.com/marcelhoffs/ha-limburg-net/tree/main/aiolimburgnet"
Issues = "https://github.com/marcelhoffs/ha-limburg-net/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aiolimburgnet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
